<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset=" UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task 0 - Responsive typography </title>
        <style>
        /* mobile default*/
            h1 {
                font-size:1.5rem ;
            }
            p {
                font-size:0.95rem ;
            }
            /*tablet */
            @media (min-width: 768px){
                h1{
                    font-size:2.5rem ;
                }
                p{
                    font-size:1.5rem;
                }
            }
            /* desktop*/
            @media (min-width:1024px){
                h1{
                    font-size:3.2rem;
                }
                p{
                    font-size:2.0rem;
                }
            }

        </style>
    </head>
    <body>
        <h1>Senevier</h1>
        <p>a black mage</p>
    </body>
   
</html>
